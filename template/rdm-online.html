        nav.querySelectorAll('.menu-item').forEach(btn => {
            btn.addEventListener('click', () => { navigate(btn.dataset.page); });
        });
    }

    function navigate(page) {
        currentPage = page;
        document.getElementById('main-content').innerHTML = content[page] || `<div class="text-slate-400">Halaman ${page}</div>`;
        renderMenu();
        // Close mobile sidebar
        if(window.innerWidth < 1024) toggleSidebar();
        // Attach deploy form
        if(page === 'deploy') {
            document.getElementById('deploy-form').addEventListener('submit', handleDeploy);
        }
    }

    function handleDeploy(e) {
        e.preventDefault();
        const steps = ['Membuat DNS Cloudflare','Membuat Database','Copy Source RDM','Konfigurasi Database','Membuat Nginx Virtual Host','Reload Nginx','Install SSL','Generate Akun Awal','Mengirim Notifikasi WhatsApp'];
        const prog = document.getElementById('deploy-progress');
        prog.classList.remove('hidden');
        prog.innerHTML = steps.map(s => `<div class="deploy-step flex items-center gap-2 text-slate-500"><i data-lucide="circle" class="w-3 h-3"></i><span>${s}</span></div>`).join('');
        lucide.createIcons();
        let i = 0;
        const interval = setInterval(() => {
            if(i > 0) prog.children[i-1].classList.remove('processing');
            if(i > 0) { prog.children[i-1].classList.add('completed'); prog.children[i-1].querySelector('i').setAttribute('data-lucide','check-circle'); }
            if(i < steps.length) { prog.children[i].classList.add('processing'); prog.children[i].querySelector('i').setAttribute('data-lucide','loader'); lucide.createIcons(); i++; }
            else { clearInterval(interval); prog.innerHTML += `<div class="mt-4 p-3 bg-emerald-500/10 border border-emerald-500/30 rounded-lg text-emerald-400 text-sm">✅ Deploy berhasil! URL: <strong>https://${document.getElementById('subdomain').value||'namamadrasah'}.rdm-online.id</strong></div>`; }
        }, 800);
    }

    function toggleSidebar() {
        const sb = document.getElementById('sidebar');
        const ov = document.getElementById('sidebar-overlay');
        sb.classList.toggle('-translate-x-full');
        ov.classList.toggle('hidden');
    }

    document.getElementById('mobile-toggle').addEventListener('click', toggleSidebar);
    document.getElementById('role-user').addEventListener('click', () => { currentRole='user'; currentPage='dashboard'; document.getElementById('role-user').className='flex-1 text-xs font-medium py-2 rounded-md bg-blue-600 text-white transition-all'; document.getElementById('role-admin').className='flex-1 text-xs font-medium py-2 rounded-md text-slate-400 transition-all'; renderMenu(); navigate(currentPage); });
    document.getElementById('role-admin').addEventListener('click', () => { currentRole='admin'; currentPage='admin-dashboard'; document.getElementById('role-admin').className='flex-1 text-xs font-medium py-2 rounded-md bg-blue-600 text-white transition-all'; document.getElementById('role-user').className='flex-1 text-xs font-medium py-2 rounded-md text-slate-400 transition-all'; renderMenu(); navigate(currentPage); });

    renderMenu();
    navigate('dashboard');
    </script>
