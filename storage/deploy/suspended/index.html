<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Langganan Berakhir — RDM Online</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #ecfdf5, #f0fdf4, #ffffff);
            color: #1f2937;
            padding: 1.5rem;
        }
        .card {
            max-width: 28rem;
            width: 100%;
            background: #fff;
            border: 1px solid #d1fae5;
            border-radius: 1rem;
            padding: 2rem;
            text-align: center;
            box-shadow: 0 20px 40px rgba(16, 185, 129, 0.12);
        }
        .icon {
            width: 3.5rem;
            height: 3.5rem;
            margin: 0 auto 1rem;
            border-radius: 999px;
            background: #fef3c7;
            color: #b45309;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }
        h1 { font-size: 1.35rem; margin-bottom: 0.75rem; color: #065f46; }
        p { color: #6b7280; line-height: 1.6; font-size: 0.95rem; }
        a {
            display: inline-block;
            margin-top: 1.5rem;
            background: #059669;
            color: #fff;
            text-decoration: none;
            padding: 0.75rem 1.25rem;
            border-radius: 0.75rem;
            font-weight: 600;
        }
        a:hover { background: #047857; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">!</div>
        <h1>Langganan Telah Berakhir</h1>
        <p>
            Akses RDM Online untuk madrasah ini telah dinonaktifkan karena masa langganan habis.
            Silakan perpanjang langganan untuk mengaktifkan kembali.
        </p>
        <a id="renew-link" href="https://rdm-online.id">Perpanjang Langganan</a>
    </div>
    <script>
        (function () {
            var host = window.location.hostname || '';
            var parts = host.split('.');
            var subdomain = parts.length > 2 ? parts[0] : '';
            var base = 'https://rdm-online.id';
            var link = document.getElementById('renew-link');
            if (subdomain && link) {
                link.href = base + '/perpanjang/' + encodeURIComponent(subdomain);
            }
        })();
    </script>
</body>
</html>
